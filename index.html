<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestionnaire de Jetons Poker</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --gold: #f1c40f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Écran de Configuration --- */
        #setup-screen {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }

        h1, h2 { text-align: center; margin: 10px 0; }
        
        input {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2c2c2c;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        button:active { opacity: 0.8; }
        .btn-primary { background-color: var(--accent-blue); color: white; }
        .btn-success { background-color: var(--accent-green); color: white; }
        .btn-danger { background-color: var(--accent-red); color: white; }
        .btn-gold { background-color: var(--gold); color: black; }

        /* --- Écran de Jeu --- */
        #game-screen {
            display: none; /* Caché au début */
            flex-direction: column;
            height: 100%;
        }

        /* Header avec le Pot et les Blindes */
        .game-header {
            background-color: #252525;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pot-display {
            font-size: 24px;
            color: var(--accent-green);
            font-weight: bold;
        }
        
        .blinds-info {
            font-size: 12px;
            color: #888;
        }

        /* Liste des joueurs */
        #players-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid transparent;
        }

        .player-card.active-dealer { border-left-color: var(--gold); }
        .player-card.is-out { opacity: 0.5; text-decoration: line-through; }

        .player-info { display: flex; flex-direction: column; }
        .player-name { font-weight: bold; font-size: 18px; }
        .player-stack { font-family: monospace; font-size: 20px; color: var(--accent-blue); }
        
        .dealer-badge {
            background: var(--gold); color: black;
            font-size: 10px; padding: 2px 6px; border-radius: 4px;
            margin-left: 8px; display: none;
        }
        .active-dealer .dealer-badge { display: inline-block; }

        .player-actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            padding: 8px 12px;
            font-size: 14px;
        }

        /* Barre de contrôle du bas */
        .bottom-controls {
            padding: 10px;
            background: #1a1a1a;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* --- Modal (Pop-up) --- */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .num-btn {
            background: #333; padding: 15px; border-radius: 5px;
            font-size: 18px; color: white;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>♣️ Poker Manager ♦️</h1>
        <p>Configuration de la partie</p>
        
        <label>Argent de départ (Cave)</label>
        <input type="number" id="start-stack" value="1000">

        <label>Blindes (Petite / Grosse)</label>
        <div style="display:flex; gap:10px;">
            <input type="number" id="sb-val" value="10" placeholder="SB">
            <input type="number" id="bb-val" value="20" placeholder="BB">
        </div>

        <label>Ajouter des joueurs</label>
        <div style="display:flex; gap:10px;">
            <input type="text" id="new-player-name" placeholder="Nom du joueur">
            <button class="btn-primary" onclick="addPlayerSetup()">+</button>
        </div>
        
        <ul id="setup-player-list" style="list-style: none; padding: 0; color: #888;"></ul>

        <button class="btn-success" onclick="startGame()" style="margin-top: auto;">Lancer la partie</button>
    </div>

    <div id="game-screen">
        <div class="game-header">
            <div class="blinds-info">
                SB: <span id="display-sb">10</span> / BB: <span id="display-bb">20</span>
            </div>
            <div class="pot-display">POT: <span id="pot-amount">0</span> $</div>
            <button class="btn-gold" style="padding: 5px 10px; font-size:12px;" onclick="nextDealer()">D</button>
        </div>

        <div id="players-list">
            </div>

        <div class="bottom-controls">
            <button class="btn-primary" onclick="openBlindModal()">Prendre Blindes</button>
            <button class="btn-danger" onclick="resetPotToPlayers()">Annuler Tour</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">Miser</h2>
            <div id="modal-amount" style="font-size: 30px; margin: 10px 0; color: var(--accent-green);">0</div>
            
            <div class="numpad">
                <button class="num-btn" onclick="typeNum(1)">1</button>
                <button class="num-btn" onclick="typeNum(2)">2</button>
                <button class="num-btn" onclick="typeNum(3)">3</button>
                <button class="num-btn" onclick="typeNum(4)">4</button>
                <button class="num-btn" onclick="typeNum(5)">5</button>
                <button class="num-btn" onclick="typeNum(6)">6</button>
                <button class="num-btn" onclick="typeNum(7)">7</button>
                <button class="num-btn" onclick="typeNum(8)">8</button>
                <button class="num-btn" onclick="typeNum(9)">9</button>
                <button class="num-btn" onclick="typeNum(0)">0</button>
                <button class="num-btn" style="background:#444" onclick="typeNum('del')">⌫</button>
                <button class="num-btn" style="background:#444" onclick="typeNum('all')">All-in</button>
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn-danger" style="flex:1" onclick="closeModal()">Annuler</button>
                <button class="btn-success" style="flex:1" onclick="confirmBet()">Valider</button>
            </div>
        </div>
    </div>

    <script>
        // --- DONNÉES ---
        let players = [];
        let pot = 0;
        let startStack = 1000;
        let sb = 10;
        let bb = 20;
        let dealerIndex = 0;
        let currentBettingPlayerIndex = -1;
        let tempAmountString = "0";

        // --- SETUP ---
        function addPlayerSetup() {
            const nameInput = document.getElementById('new-player-name');
            const name = nameInput.value.trim();
            if(name) {
                players.push({ name: name, stack: parseInt(document.getElementById('start-stack').value), active: true });
                const li = document.createElement('li');
                li.textContent = `👤 ${name}`;
                document.getElementById('setup-player-list').appendChild(li);
                nameInput.value = '';
            }
        }

        function startGame() {
            if (players.length < 2) return alert("Il faut au moins 2 joueurs !");
            
            startStack = parseInt(document.getElementById('start-stack').value);
            sb = parseInt(document.getElementById('sb-val').value);
            bb = parseInt(document.getElementById('bb-val').value);

            // Mise à jour des affichages
            document.getElementById('display-sb').textContent = sb;
            document.getElementById('display-bb').textContent = bb;

            // Changement d'écran
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            renderPlayers();
        }

        // --- MOTEUR DE JEU ---

        function renderPlayers() {
            const list = document.getElementById('players-list');
            list.innerHTML = '';

            players.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = `player-card ${index === dealerIndex ? 'active-dealer' : ''} ${p.stack === 0 ? 'is-out' : ''}`;
                
                card.innerHTML = `
                    <div class="player-info">
                        <div class="player-name">
                            ${p.name} <span class="dealer-badge">D</span>
                        </div>
                        <div class="player-stack">${p.stack} $</div>
                    </div>
                    <div class="player-actions">
                        <button class="action-btn btn-danger" onclick="openBetModal(${index})">Miser</button>
                        <button class="action-btn btn-success" onclick="winPot(${index})">Gagner</button>
                    </div>
                `;
                list.appendChild(card);
            });
            document.getElementById('pot-amount').textContent = pot;
        }

        // --- GESTION DU DEALER & BLINDES ---
        function nextDealer() {
            dealerIndex = (dealerIndex + 1) % players.length;
            renderPlayers();
        }

        function openBlindModal() {
            // Logique simplifiée : Retire SB au joueur après Dealer, BB au suivant
            let sbIndex = (dealerIndex + 1) % players.length;
            let bbIndex = (dealerIndex + 2) % players.length;
            
            // S'assurer qu'ils ont assez (cas simple)
            bet(sbIndex, sb);
            bet(bbIndex, bb);
        }

        // --- GESTION DES MISES (MODAL) ---
        function openBetModal(index) {
            currentBettingPlayerIndex = index;
            tempAmountString = "0";
            document.getElementById('modal-title').textContent = `Mise de ${players[index].name}`;
            document.getElementById('modal-amount').textContent = "0";
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function typeNum(val) {
            if (val === 'del') {
                tempAmountString = tempAmountString.slice(0, -1) || "0";
            } else if (val === 'all') {
                tempAmountString = String(players[currentBettingPlayerIndex].stack);
            } else {
                if(tempAmountString === "0") tempAmountString = String(val);
                else tempAmountString += val;
            }
            document.getElementById('modal-amount').textContent = tempAmountString;
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function confirmBet() {
            const amount = parseInt(tempAmountString);
            if (amount > 0) {
                bet(currentBettingPlayerIndex, amount);
            }
            closeModal();
        }

        function bet(playerIndex, amount) {
            const p = players[playerIndex];
            if (amount > p.stack) amount = p.stack; // Ne peut pas miser plus que ce qu'il a
            
            p.stack -= amount;
            pot += amount;
            renderPlayers();
        }

        // --- GESTION DES GAINS ---
        function winPot(playerIndex) {
            if(pot === 0) return;
            if(confirm(`Confirmer que ${players[playerIndex].name} remporte le pot de ${pot}$ ?`)) {
                players[playerIndex].stack += pot;
                pot = 0;
                renderPlayers();
            }
        }

        function resetPotToPlayers() {
            if(pot === 0) return;
            if(confirm("Annuler le pot et le laisser sur la table ? (Si erreur, distribuez manuellement)")) {
                // Fonction basique : pour l'instant on garde le pot pour le prochain tour ou on reset
                // Ici on remet simplement à 0 si c'était une erreur de manip, mais idéalement on diviserait
                alert("Le pot reste affiché, utilisez 'Gagner' sur le joueur qui récupère sa mise.");
            }
        }

    </script>
</body>
</html>
